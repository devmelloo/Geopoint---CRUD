services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: geopoint
      POSTGRES_USER: geopoint
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:-geopoint_dev_123}
    ports:
      - "${LOCAL_DB_PORT:-5433}:5432"
    volumes:
      - geopoint_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geopoint -d geopoint"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build: .
    ports:
      - "${LOCAL_API_PORT:-8080}:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/geopoint
      DB_USER: geopoint
      DB_PASSWORD: ${LOCAL_DB_PASSWORD:-geopoint_dev_123}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  geopoint_pgdata:
